<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wondering — Discord Bot</title>
<meta name="description" content="Wondering — Discord-бот для вашего сервера.">

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --background: #0d0e12;
    --card: rgba(22, 24, 31, 0.82);
    --border: rgba(255, 255, 255, 0.07);
    --text: #f1f1f4;
    --text-secondary: #a4a6b0;
    --text-muted: #70727c;
    --accent: #fac0fc;
    --accent-soft: rgba(250, 192, 252, 0.12);
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(circle at 50% -10%, rgba(250, 192, 252, 0.1), transparent 38%),
        radial-gradient(circle at 90% 90%, rgba(120, 100, 180, 0.07), transparent 35%),
        var(--background);
    color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
        linear-gradient(rgba(255, 255, 255, 0.012) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.012) 1px, transparent 1px);
    background-size: 40px 40px;
}

.container {
    width: min(700px, calc(100% - 32px));
    text-align: center;
}

.logo {
    width: 72px;
    height: 72px;
    margin: 0 auto 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(250, 192, 252, 0.2);
    border-radius: 21px;
    background: rgba(250, 192, 252, 0.07);
    color: var(--accent);
    font-size: 29px;
    font-weight: 700;
    box-shadow: 0 0 45px rgba(250, 192, 252, 0.1);
}

h1 {
    font-size: clamp(38px, 7vw, 58px);
    letter-spacing: -2px;
}

h1 span {
    color: var(--accent);
}

.description {
    max-width: 520px;
    margin: 16px auto 30px;
    color: var(--text-secondary);
    font-size: 15px;
    line-height: 1.7;
}

.buttons {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
}

.button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 150px;
    padding: 12px 18px;
    border: 1px solid var(--border);
    border-radius: 11px;
    background: rgba(255, 255, 255, 0.025);
    color: var(--text);
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    transition: 0.2s ease;
}

.button:hover {
    transform: translateY(-2px);
    background: var(--accent-soft);
    border-color: rgba(250, 192, 252, 0.22);
}

.button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #171319;
}

.button.primary:hover {
    background: #f8b6fa;
    border-color: #f8b6fa;
}

.documents {
    width: min(520px, 100%);
    margin: 55px auto 0;
    padding: 22px;
    border: 1px solid var(--border);
    border-radius: 18px;
    background: var(--card);
    backdrop-filter: blur(18px);
}

.documents-title {
    margin-bottom: 15px;
    color: var(--text-muted);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.8px;
    text-transform: uppercase;
}

.links {
    display: flex;
    gap: 10px;
}

.link {
    flex: 1;
    padding: 11px;
    border-radius: 10px;
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 12px;
    transition: 0.2s ease;
}

.link:hover {
    background: rgba(250, 192, 252, 0.06);
    color: var(--accent);
}

footer {
    margin-top: 30px;
    color: var(--text-muted);
    font-size: 11px;
}

footer strong {
    color: #999ba5;
    font-weight: 500;
}

@media (max-width: 500px) {
    .container {
        width: min(100% - 22px, 700px);
    }

    .links {
        flex-direction: column;
    }

    .documents {
        padding: 18px;
    }
}
</style>
</head>

<body>
<div class="container">
    <div class="logo">W</div>

    <h1>Wonder<span>ing</span></h1>

    <p class="description">
        Discord-бот с набором полезных инструментов для управления
        сервером, автоматизации и удобного взаимодействия с сообществом.
    </p>

    <div class="buttons">
        <a class="button primary" href="https://discord.com/oauth2/authorize">
            Добавить бота
        </a>

        <a class="button" href="https://discord.com">
            Discord
        </a>
    </div>

    <div class="documents">
        <div class="documents-title">Документы</div>

        <div class="links">
            <a class="link" href="./terms/">
                Условия использования
            </a>

            <a class="link" href="./privacy/">
                Политика конфиденциальности
            </a>
        </div>
    </div>

    <footer>
        <strong>Wondering</strong> · Discord Bot
        <br>
        © 2026 Wondering. Все права защищены.
    </footer>
</div>
</body>
</html>
